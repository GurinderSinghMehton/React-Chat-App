services:
  - type: web
    name: react-chat-app
    env: node
    region: oregon
    plan: free
    
    # Root directory - project root to access both client and server
    rootDir: .
    
    # Build command - uses build.sh script
    buildCommand: bash build.sh
    
    # Start command - run server from server directory
    startCommand: node server/index.js
    
    # Environment variables - configure these in Render dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        scope: build
        sync: false
      - key: ORIGIN
        scope: build
        sync: false
